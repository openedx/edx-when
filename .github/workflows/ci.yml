name: Python CI

on:
  pull_request:
    branches:
      - '**'
  workflow_call:

jobs:
  run_tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ '3.12' ]
        toxenv: [ quality, docs, pii_check, django42, django52 ]
        db: [ mysql, postgres ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: openedx
          MYSQL_ROOT_PASSWORD: openedx
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres
        env:
          POSTGRES_USER: openedx
          POSTGRES_PASSWORD: openedx
          POSTGRES_DB: openedx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --locked --group ci

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
          DB_ENGINE: ${{ matrix.db == 'mysql' && 'django.db.backends.mysql' || 'django.db.backends.postgresql' }}
          DB_NAME: openedx
          DB_USER: ${{ matrix.db == 'mysql' && 'root' || 'openedx' }}
          DB_PASSWORD: openedx
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'mysql' && '3307' || '5432' }}
        run: |
          uv run --locked tox
      - name: Rename Coverage File
        if: matrix.python-version == '3.12' && matrix.toxenv=='django52'
        run: |
          if [ -f .coverage ]; then
            mv .coverage coverage.${{ matrix.db }}
          fi
      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.12' && matrix.toxenv=='django52'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.db }}
          path: coverage.${{ matrix.db }}
          include-hidden-files: true

  merge_and_upload_coverage:
    name: Merge and Upload Coverage
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-mysql
          path: ./
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-postgres
          path: ./
      - name: Debug Coverage File
        run: ls -la
      - name: Merge Coverage Reports
        run: |
          uvx coverage combine coverage.mysql coverage.postgres
          uvx coverage xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
