name: Migrations check on postgresql and mysql

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-migrations:
    services:
      mysql:
        image: mysql:8.0
        env:
          # The MySQL docker container requires these environment variables to be set
          # so we can create and migrate the test database.
          # See: https://hub.docker.com/_/mysql
          MYSQL_DATABASE: openedx
          MYSQL_ROOT_PASSWORD: openedx
        ports:
          # Opens port 3306 on service container and host
          # https://docs.github.com/en/actions/using-containerized-services/about-service-containers
          - 3307:3306
          # Before continuing, verify the mysql container is reachable from the ubuntu host
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres
        env:
          POSTGRES_USER: openedx
          POSTGRES_PASSWORD: openedx
          POSTGRES_DB: openedx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    name: check migrations
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ '3.12' ]
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --locked --group test
      - name: Apply Postgresql Migrations
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: openedx
          DB_USER: openedx
          DB_PASSWORD: openedx
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          uv run --locked --group test --with mysqlclient --with psycopg2-binary python manage.py migrate --settings=test_settings
      - name: Apply Mysql Migrations
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: openedx
          DB_USER: root
          DB_PASSWORD: openedx
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
        run: |
          uv run --locked --group test --with mysqlclient --with psycopg2-binary python manage.py migrate --settings=test_settings
