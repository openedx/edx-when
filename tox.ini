[tox]
envlist = django{42,52}, pii_check, quality, docs
requires =
    tox-uv>=1

[doc8]
max-line-length = 120

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
ignore = D101,D200,D203,D212,D215,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414
match-dir = (?!migrations)

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov edx_when --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    python -Wd -m pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups =
    doc
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
    twine
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/edx_when.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html
    python -m build --wheel
    twine check dist/*

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups =
    quality
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
    touch
commands =
    touch tests/__init__.py
    pylint src/edx_when tests test_utils manage.py
    rm tests/__init__.py
    pycodestyle src/edx_when tests manage.py
    pydocstyle src/edx_when tests manage.py
    isort --check-only --diff tests test_utils src/edx_when manage.py test_settings.py
    make selfcheck

[testenv:pii_check]
runner = uv-venv-lock-runner
dependency_groups =
    test
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
commands =
    code_annotations django_find_annotations --config_file .pii_annotations.yml --lint --report --coverage

