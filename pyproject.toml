[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-when"
description = "Your project description goes here"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt", "AUTHORS"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "Django",
    "edx",
]

dynamic = ["readme", "version"]

dependencies = [
    "Django>=1.11",
    "django-model-utils",
    "edx-django-utils",
    "edx-drf-extensions",
    "edx-opaque-keys",
    "xblock",
]

[project.entry-points."lms.djangoapp"]
edx_when = "edx_when.apps:EdxWhenConfig"

[project.entry-points."cms.djangoapp"]
edx_when = "edx_when.apps:EdxWhenConfig"

[project.entry-points."openedx.block_structure_transformer"]
load_date_data = "edx_when.field_data:DateOverrideTransformer"

[project.urls]
Homepage = "https://github.com/openedx/edx-when"
Repository = "https://github.com/openedx/edx-when"

[dependency-groups]
test-base = [
    "code-annotations",
    "ddt",
    "mock>=1.0.1",
    "pytest-cov",
    "pytest-django",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    {include-group = "test"},
    "build",
    "doc8",
    "Sphinx",
    "sphinx-book-theme",
    "twine",
]
ci = [
    "tox",
    "tox-uv>=1",
]
dev = [
    {include-group = "quality"},
    {include-group = "doc"},
    {include-group = "ci"},
    "diff-cover",
    "edx-i18n-tools",
    "path.py==11.5.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
include = ["edx_when", "edx_when.*"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
edx_when = ["templates/**/*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.semantic_release]
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"

[tool.uv]
package = true
default-groups = []
conflicts = [
    [{group = "test"}, {group = "django42"}],
    [{group = "quality"}, {group = "django42"}],
    [{group = "doc"}, {group = "django42"}],
    [{group = "dev"}, {group = "django42"}],
]
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
    "diff-cover==4.0.0",
]

[tool.edx_lint]
uv_constraints = [
    "diff-cover==4.0.0",
]

[tool.isort]
indent = "    "
line_length = 120
multi_line_output = 3

[tool.coverage.run]
branch = true
data_file = ".coverage"
source = ["edx_when"]
omit = [
    "test_settings",
    "*/migrations/*",
    "*admin.py",
    "*static*",
    "*templates*",
]
